name: Deploy

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Install lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ga.key
          chmod 600 ~/.ssh/ga.key
          cat >>~/.ssh/config <<END
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/ga.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
      - name: Compile
        run: sbt "set scalaJSStage in Global := FullOptStage" Test/compile
      - name: Build deb packages
        run: |
          sbt "mode prod" compile
          sbt "mode prod" Deb/packageBin
      - name: Deploy pimpcloud
        run: |
          scp pimpcloud/target/pimpcloud.deb server:/home/mle/pimpcloud.deb
          ssh server 'sudo dpkg --force-confold -i /home/mle/pimpcloud.deb'
